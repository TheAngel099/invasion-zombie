# ==============================================================================
#                 ZOMBIE INVASION - CAJA MISTERIOSA (MYSTERY BOX)
#                         Creado por TheAngelSAF
# ==============================================================================
# Configuración avanzada de la Caja Misteriosa estilo CoD Zombies.
# Los nombres y descripciones soportan formato MiniMessage (<gradient>, <color>, <b>)
# y códigos clásicos de color con &.
#
# Comandos al reclamar:
#   Puedes añadir comandos de consola que se ejecutarán cuando el jugador recoja el ítem.
#   Variables disponibles: %player%, %item%
# ==============================================================================

settings:
  # Costo por cada tirada de la caja en Z-Coins o economía Vault
  cost: 950
  
  # Duración del giro de la ruleta en ticks (20 ticks = 1 segundo, 60 = 3s)
  roll-duration-ticks: 60
  
  # Tiempo en segundos que el jugador tiene para recoger el ítem antes de que la caja se cierre
  claim-timeout-seconds: 10
  
  # Si el premio es un arco o ballesta, ¿entregar automáticamente 64 flechas de combate?
  give-arrows-with-ranged: true

  # Broma del Peluche (Teddy Bear) que enfurece la caja y la teletransporta a otra ubicación
  teddy-bear:
    enabled: true
    # Probabilidad en porcentaje (8.0 = 8%)
    chance-percent: 8.0

# ==============================================================================
#                            POOL DE ÍTEMS Y ARMAS
# ==============================================================================
# Habilidades especiales nativas disponibles para 'special-ability':
#   - THUNDER_BOW     (Dispara flechas que invocan rayos celestiales y daño de área radial)
#   - RAY_GUN         (Clic derecho dispara un haz de plasma sónico penetrante)
#   - VAMPIRE_BLADE   (Regenera salud y comida con cada baja de zombie)
#   - FROST_CROSSBOW  (Inmoviliza y congela en área a todos los zombies cercanos)
#   - MONKEY_BOMB     (Lanza un señuelo musical que atrae a los zombies y detona)
#   - NONE            (Ítem estándar sin habilidad mítica nativa)
#
# Parámetros editables por ítem:
#   - damage / attack-damage: Daño personalizado infligido al atacar o al detonar la habilidad.
#   - unbreakable: true/false (Si es true, el ítem jamás se gasta ni se rompe).
#   - durability: Durabilidad personalizada restante si unbreakable es false.
#   - weight: Probabilidad relativa de aparición en la ruleta de la caja.
# ==============================================================================
items:
  thunder_bow:
    enabled: true
    weight: 15
    special-ability: "THUNDER_BOW"
    material: "BOW"
    amount: 1
    damage: 30.0
    unbreakable: true
