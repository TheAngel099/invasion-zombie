# ==========================================
#        CONFIGURACIÓN DE VARIANTES DE ZOMBIE
# ==========================================
# Aquí puedes activar, desactivar o modificar las características
# de cada tipo de zombie especial que aparece en la invasión.
# weight: Probabilidad relativa de spawn de cada variante (mayor peso = más frecuente).
variants:
  enabled: true
  tactical_targeting: true # IA Asimétrica: Asigna objetivos según el rol de cada variante y previene que todos sigan a 1 jugador
  types:
    TANK:
      enabled: true
      weight: 15
      health: 60.0
      projectile_resistance: 0.8
      name: "<gradient:#888888:#333333><b>[TANQUE] Zombie Blindado</b></gradient>"
    SPEED:
      enabled: true
      weight: 15
      speed_amplifier: 2
      name: "<gradient:#ffff00:#ffaa00><b>[RÁPIDO] Zombie</b></gradient>"
    ENDER:
      enabled: true
      weight: 12
      teleport_cooldown_ticks: 10
      teleport_max_distance: 25.0
      dodge_chance: 0.65
      name: "<gradient:#aa00ff:#5500aa><b>[ENDER] Zombie</b></gradient>"
    EXPLOSIVE:
      enabled: true
      weight: 12
      fuse_seconds: 1.2
      explosion_radius: 4.5
      damage: 14.0
      name: "<gradient:#ff8800:#ff2200><b>[EXPLOSIVO] Zombie</b></gradient>"
    FROST:
      enabled: true
      weight: 12
      freeze_ticks: 140
      aura_radius: 4.0
      name: "<gradient:#55ffff:#0088cc><b>[GÉLIDO] Zombie</b></gradient>"
    SPITTER:
      enabled: true
      weight: 10
      spit_cooldown_ticks: 8
      puddle_radius: 2.5
      puddle_duration_seconds: 4
      name: "<gradient:#55ff55:#00aa00><b>[TÓXICO] Zombie Escupidor</b></gradient>"
    NECROMANCER:
      enabled: true
      weight: 8
      summon_cooldown_ticks: 24
      max_minions: 2
      name: "<gradient:#aa00ff:#440088><b>[NIGROMANTE] Zombie</b></gradient>"
    BERSERKER:
      enabled: true
      weight: 10
      frenzy_threshold: 0.35
      name: "<gradient:#ff2222:#880000><b>[BERSERKER] Zombie</b></gradient>"
    VORTEX:
      enabled: true
      weight: 8
      pulse_cooldown_ticks: 20
      pull_radius: 8.5
      name: "<gradient:#3366ff:#000066><b>[VORTEX] Zombie Magnético</b></gradient>"
    PHANTOM:
      enabled: true
      weight: 8
      dodge_chance: 0.35
      name: "<gradient:#00ffff:#005577><b>[ESPECTRAL] Zombie</b></gradient>"
    DEFAULT:
      enabled: true
      weight: 25

